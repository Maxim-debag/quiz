<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор вопросов — Викторина</title>
<style>:root {
  --bg1: #0e1130;
  --bg2: #1a1f4d;
  --card: #232858;
  --card2: #2d3370;
  --line: rgba(255,255,255,.14);
  --text: #eef1ff;
  --muted: #9aa3d0;
  --accent: #ffd23f;
  --accent2: #38bdf8;
  --ok: #4ade80;
  --bad: #fb7185;
  --violet: #c084fc;
  --radius: 16px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --grad: linear-gradient(135deg, #ffd23f, #ff9f43);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  background: radial-gradient(1200px 700px at 20% -10%, #2b3175 0%, transparent 60%),
              radial-gradient(1000px 600px at 110% 110%, #452a7a 0%, transparent 55%),
              linear-gradient(160deg, var(--bg1), var(--bg2));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 200;
}

/* ---------- screens ---------- */
.screen { display: none; width: 100%; justify-content: center; }
.screen.active { display: flex; animation: fadeUp .45s ease both; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card {
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0)),
              var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  width: 100%;
  max-width: min(1600px, 96vw);
}
.card.narrow { max-width: 460px; }
.card.setup { max-width: min(1100px, 96vw); }

.logo {
  font-size: 34px;
  text-align: center;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.subtitle { text-align: center; color: var(--muted); margin-bottom: 22px; }

.field { margin-bottom: 18px; }
.field > label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
.field > label b { color: var(--text); }

/* ---------- controls ---------- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 99px;
  background: var(--card2);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--grad);
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,.4);
  cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  cursor: pointer;
}

select {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}
select:focus { border-color: var(--accent2); }

.mode-switch {
  display: flex;
  background: var(--card2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 18px;
  gap: 4px;
}
.mode-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}
.mode-btn.active {
  background: var(--grad);
  color: #21202f;
}

.btn {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--grad); color: #21202f; box-shadow: 0 8px 22px rgba(255,210,63,.28); }
.btn.primary:hover { box-shadow: 0 12px 30px rgba(255,210,63,.4); }
.btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
.btn.ok { background: var(--ok); color: #0b2f1d; }
.btn.bad { background: var(--bad); color: #3a0a12; }
.btn.big { width: 100%; font-size: 17px; padding: 15px; margin-top: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.small { padding: 7px 12px; font-size: 13px; margin-top: 8px; }

/* ---------- names ---------- */
#names-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
#names-box .name-cloud { display: flex; align-items: center; gap: 8px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
#names-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 14px;
  min-width: 0;
}
#names-box input::placeholder { color: var(--muted); }
.name-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

/* ---------- chips (themes) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.on { background: var(--grad); color: #21202f; border-color: transparent; font-weight: 600; }
.chip .chip-lvl {
  font-size: 11px;
  font-weight: 600;
  background: rgba(255,255,255,.16);
  color: var(--text);
  padding: 2px 8px;
  border-radius: 99px;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  max-width: 96px;
}
.chip .chip-lvl option { background: #1b2333; color: var(--text); }
.chip .chip-lvl:hover { filter: brightness(1.15); }
.chip.on .chip-lvl { background: rgba(33,32,47,.18); color: inherit; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* ---------- pick screen ---------- */
.pick-card { text-align: center; max-width: 520px; }
.pick-card h2 { color: var(--muted); font-size: 20px; margin-bottom: 24px; }
.wheel-wrap {
  position: relative;
  width: min(72vw, 340px);
  margin: 0 auto 20px;
}
#pick-wheel {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 0 8px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.5);
}
.wheel-pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 25px solid #fff;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
  z-index: 2;
}
.pick-result {
  font-size: 22px;
  font-weight: 800;
  min-height: 30px;
  margin: 4px 0 16px;
}
#pick-spin { margin-bottom: 10px; }

@keyframes pop {
  0%   { transform: scale(.7); }
  100% { transform: scale(1); }
}

.show { visibility: hidden; }

/* ---------- board ---------- */
#screen-board { flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: min(1800px, 97vw); }

.board-top { width: 100%; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.board-title { display: flex; align-items: center; gap: 12px; }
.turn-badge {
  background: var(--grad);
  color: #21202f;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: 99px;
  font-size: 14px;
  box-shadow: 0 6px 18px rgba(255,210,63,.3);
  transition: transform .3s;
}
.turn-badge.bump { animation: pop .4s; }
.used-count { color: var(--muted); font-size: 14px; }

.scores { display: flex; flex-wrap: wrap; gap: 10px; }
.score-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 14px;
  box-shadow: var(--shadow);
  min-width: 130px;
  transition: all .25s;
}
.score-card .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }
.score-card .s-name { font-size: 14px; font-weight: 600; }
.score-card .s-pts { margin-left: auto; font-size: 19px; font-weight: 800; color: var(--accent); }
.score-card.active { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(56,189,248,.35), var(--shadow); }
.score-card.bump .s-pts { animation: ptsBump .5s; }
@keyframes ptsBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.5); color: var(--ok); }
  100% { transform: scale(1); }
}

.grid-wrap { width: 100%; overflow-x: auto; padding-bottom: 8px; }
.grid {
  display: grid;
  gap: 12px 14px;
  grid-auto-rows: auto;
  min-width: min-content;
  align-items: center;
}
.price-head {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 800;
  color: var(--muted);
  padding-bottom: 4px;
}
.th-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  text-align: left;
  font-size: 20px;
  font-weight: 700;
  min-height: 96px;
  padding: 10px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.1), transparent) , var(--card2);
  border: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.th-label .head-lvl {
  font-size: 13px;
  font-weight: 600;
  opacity: .75;
  background: rgba(255,255,255,.1);
  padding: 1px 8px;
  border-radius: 99px;
}
.cell {
  border: none;
  width: 124px;
  height: 124px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), linear-gradient(160deg, #4b63e6, #2f3fb5);
  color: var(--accent);
  font-size: 40px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.22), inset 0 2px 4px rgba(255,255,255,.18);
  transition: transform .13s ease, box-shadow .2s ease, filter .2s;
}
.cell:hover { transform: translateY(-3px) scale(1.06); box-shadow: 0 12px 26px rgba(0,0,0,.45); filter: brightness(1.1); }
.cell:active { transform: scale(.95); }
.cell.used { background: rgba(255,255,255,.06); color: transparent; cursor: default; box-shadow: none; filter: none; transform: none; }
.cell.used::after { content: "✓"; font-size: 42px; color: var(--muted); }
.cell.empty { background: transparent; border: 3px dashed rgba(255,255,255,.22); color: transparent; pointer-events: none; box-shadow: none; }

/* ---------- question modal ---------- */
.modal { position: fixed; inset: 0; display: none; z-index: 100; }
.modal.open { display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10,12,30,.78); }
.modal-card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 26px;
  animation: modalIn .35s cubic-bezier(.25,1.2,.4,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.8) translateY(30px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.close {
  position: absolute;
  top: 12px; right: 14px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 28px;
  cursor: pointer;
  line-height: 1;
}
.close:hover { color: var(--bad); }

.q-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.q-theme { background: var(--card2); padding: 6px 12px; border-radius: 99px; font-size: 13px; }
.q-price { background: var(--grad); color: #21202f; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; }
.q-text { font-size: 22px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; }

#q-answers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
#q-answers.choice-answers { display: grid; grid-template-columns: repeat(2, 1fr); }
.opt {
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--text);
  border-radius: 12px;
  padding: 13px 16px;
  font-size: 15px;
  cursor: pointer;
  text-align: left;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.opt .opt-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex: none;
}
.opt:hover { border-color: var(--accent2); }
.opt.sel { border-color: var(--accent2); background: rgba(56,189,248,.18); box-shadow: 0 0 0 1px var(--accent2); }
.opt.sel .opt-letter { background: var(--accent2); color: #0a1020; }
.opt.right { border-color: var(--ok); background: rgba(74,222,128,.2); color: var(--ok); }
.opt.right .opt-letter { background: var(--ok); color: #0b2f1d; }
.opt.wrong { border-color: var(--bad); background: rgba(251,113,133,.2); color: var(--bad); text-decoration: line-through; }
.opt.wrong .opt-letter { background: var(--bad); color: #3a0a12; }
.opt:disabled { cursor: default; }

input[type="text"].answer, input[type="number"].answer {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  font-size: 16px;
  padding: 13px 16px;
  outline: none;
  transition: border-color .2s;
  margin-bottom: 20px;
}
input[type="text"].answer:focus, input[type="number"].answer:focus { border-color: var(--accent2); }

.q-asker { margin-bottom: 16px; }
.label-asker { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
#q-asker-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.asker-btn {
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--text);
  border-radius: 99px;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.asker-btn .dot { width: 10px; height: 10px; border-radius: 50%; }
.asker-btn.sel { border-color: var(--accent2); background: rgba(56,189,248,.18); }

.q-actions { margin-top: 4px; }

.q-verdict { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); animation: fadeUp .3s ease; }
.correct-title { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.q-correct { font-size: 18px; font-weight: 800; color: var(--ok); margin-bottom: 14px; }
.verdict-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.verdict-btns .btn { flex: 1; min-width: 150px; }

/* ---------- end ---------- */
.end-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.end-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
}
.end-row .place { font-size: 20px; font-weight: 800; width: 34px; color: var(--muted); }
.end-row.first .place { color: var(--accent); }
.end-row .e-name { font-size: 17px; font-weight: 700; }
.end-row .e-pts { margin-left: auto; font-size: 20px; font-weight: 800; color: var(--accent); }
.end-title { text-align: center; margin-bottom: 18px; }

/* ---------- editor ---------- */
.editor { max-width: min(1600px, 96vw); }
.editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.editor-head h1 { font-size: 26px; }
.editor-tools { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.theme-pill {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.theme-pill .del { cursor: pointer; color: var(--muted); font-weight: 800; background: none; border: none; font-size: 16px; }
    .theme-pill .del:hover { color: var(--bad); }
    .theme-pill em { color: var(--muted); font-style: normal; font-size: 12px; }
    .theme-pill.clickable { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .theme-pill.clickable:hover { border-color: var(--accent2); }
    .theme-pill.open { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(56,189,248,.35); }
    .theme-pill.open .tp-name { color: var(--text); font-weight: 700; }
    .theme-pill .tp-lvl {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent2);
      background: rgba(56,189,248,.12);
      padding: 3px 10px;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      max-width: 130px;
    }
    .theme-pill .tp-lvl:hover { background: rgba(56,189,248,.24); }
    .theme-pill .tp-lvl option { background: #1b2333; color: var(--text); }

.q-list { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 20px; }
.q-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-left: 5px solid var(--accent);
  border-radius: 12px;
  padding: 8px 12px;
}
.q-row .q-type { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 6px; background: var(--card); color: var(--muted); flex: none; }
.q-row .q-brief { flex: 1; font-size: 14px; min-width: 0; line-height: 1.4; white-space: normal; text-overflow: clip; overflow: visible; }
.q-row .q-brief .b { display: block; overflow-wrap: anywhere; }
.q-row .q-brief .t { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.q-row .q-price { flex: none; }
.q-row .row-btns { display: flex; gap: 6px; flex: none; }
.q-row .row-btns button { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.q-row .row-btns button.danger:hover { background: var(--bad); color: #fff; }

.add-theme { display: flex; gap: 8px; margin-bottom: 10px; }
.add-theme input { flex: 1; }
.add-theme select { width: auto; max-width: 160px; font-size: 13px; padding: 9px 10px; }

.empty-state { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 15px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.ed-field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.ed-field input, .ed-field select, .ed-field textarea {
  width: 100%;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  font-family: inherit;
}
.ed-field input:focus, .ed-field select:focus, .ed-field textarea:focus { border-color: var(--accent2); }
.ed-field textarea { resize: vertical; min-height: 74px; }
.opt-in { display: flex; align-items: center; gap: 8px; }
.opt-in span { color: var(--muted); font-weight: 700; width: 24px; }
.opt-in input { flex: 1; }
#opt-box { display: flex; flex-direction: column; gap: 8px; }

.toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: var(--shadow);
  z-index: 300;
  opacity: 0;
  transition: all .3s;
  font-size: 14px;
  text-align: center;
  max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.editor-link { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; }
.editor-link:hover { color: var(--accent2); text-decoration: underline; }

.lock-screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 1000; background: rgba(10,12,30,.88); padding: 20px; }
.lock-screen.open { display: flex; }
.lock-screen .card { width: 100%; }
.lock-screen.shake { animation: shake .4s; }
@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-12px); }
  40% { transform: translateX(12px); }
  60% { transform: translateX(-8px); }

  /* Приводит данные к актуальному формату (темы = {name, level}, уровни 1–4 убраны). */
  function normalize(d) {
    if (!d || typeof d !== 'object') return empty();
    var seen = {};
    var themes = [];
    (Array.isArray(d.themes) ? d.themes : []).forEach(function (t) {
      var name = typeof t === 'string' ? t.trim() : String((t && t.name) || '').trim();
      if (!name) return;
      var key = name.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      var lvl = (t && +t.level) || 0;
      if (lvl > 0) lvl = Math.max(5, Math.min(11, lvl));
      else {
        var cat = CATALOG.find(function (c) { return c.name.toLowerCase() === key; });
        if (cat) lvl = cat.level;
      }
      themes.push({ name: name, level: lvl });
    });
    var questions = [];
    (Array.isArray(d.questions) ? d.questions : []).forEach(function (q) {
      if (!q || typeof q.text !== 'string' || !q.text.trim() ||
          typeof q.answer !== 'string' || !q.answer.trim()) return;
      var tn = String(q.theme || '').trim();
      if (!tn) return;
      var key = tn.toLowerCase();
      if (!seen[key]) { seen[key] = true; themes.push({ name: tn, level: 0 }); }
      q.theme = tn;
      if (q.type !== 'choice' && q.type !== 'number') q.type = 'text';
      if (q.type === 'choice' && !Array.isArray(q.options)) q.type = 'text';
      q.price = [100, 200, 300, 400, 500, 600].indexOf(+q.price) >= 0 ? +q.price : 100;
      questions.push(q);
    });
    return { themes: themes, questions: questions, version: (+d.version) || 0 };
  }

  /* Добавляет недостающие темы каталога и тестовую тему к данным. */
  function mergeCatalog(d) {
    d = normalize(d || {});
    var base = demo();
    base.themes.forEach(function (t) {
      if (!d.themes.some(function (x) { return x.name.toLowerCase() === t.name.toLowerCase(); })) {
        d.themes.push({ name: t.name, level: t.level });
      }
    });
    var hasTest = d.themes.some(function (x) { return x.name.toLowerCase() === 'Тест'.toLowerCase(); });
    if (!hasTest) {
      d.themes.push({ name: 'Тест', level: 0 });
      d.questions = d.questions.concat(base.questions);
    }
    return d;
  }

  /* Перенос старой версии: добавляем каталог и обновляем тему «Тест» новыми вопросами. */
  function migrateOld(d) {
    d = mergeCatalog(d);
    var base = demo();
    d.questions = d.questions.filter(function (q) {
      return String(q.theme).toLowerCase() !== 'Тест'.toLowerCase();
    });
    d.questions = d.questions.concat(base.questions);
    return d;
  }

  function readStored(key) {
    try {
      var raw = localStorage.getItem(key);

    } catch (e) { }
    return null;
  }

  var Store = {
    load: function () {

      /* Если сайт лежит на хостинге рядом с quiz-questions.json,

      if (window.__QUIZ_JSON__ !== undefined) {
        try {
          var hosted = normalize(JSON.parse(window.__QUIZ_JSON__));
          if (+(hosted.version || 0) >= +((local && local.version) || 0)) {
            this.save(hosted);
            return hosted;
          }
        } catch (e) { }
      }

      if (local) return normalize(local);

      /* Первый запуск: переносим старые данные (если были) или берём заготовки. */
      var old = readStored(KEY_V3) || readStored(KEY_V2) || readStored(KEY_V1);
      var d = old ? migrateOld(old) : normalize(demo());
      this.save(d);
      return d;
    },
    save: function (data) {
      try {
        localStorage.setItem(KEY, JSON.stringify(data));

      } catch (e) {
        alert('Не удалось сохранить данные в браузере.');

      }
    },
    get: function () {
      return this.load();
    },
    reset: function () {
      this.save(empty());
    },
    /* Возвращает true, если что-то добавил (каталог тем или тестовую тему). */
    ensureCatalog: function () {
      var data = this.load();
      var base = demo();
      var changed = false;
      base.themes.forEach(function (t) {
        if (!data.themes.some(function (x) { return x.name.toLowerCase() === t.name.toLowerCase(); })) {
          data.themes.push({ name: t.name, level: t.level });
          changed = true;
        }
      });
      var hasTest = data.themes.some(function (x) { return x.name.toLowerCase() === 'Тест'.toLowerCase(); });
      if (!hasTest) {
        data.themes.push({ name: 'Тест', level: 0 });
        data.questions = data.questions.concat(base.questions);
        changed = true;
      }
      if (changed) this.save(data);
      return changed;
    },
    levelLabel: function (l) {
      l = +l || 0;
      return l > 0 ? l + ' класс' : 'любой';
    }
  };

  window.Store = Store;
})();</script>
<script>(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  var data = Store.get();
  var editingId = null;
  var nextId = Date.now();
  var openTheme = null;

  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function save() {
    Store.save(data);
  }

  /* ---------------- themes ---------------- */
  function renderThemes() {
    var strip = $('#theme-strip');
    strip.innerHTML = '';
    var dl = $('#theme-list');
    dl.innerHTML = '';
    data.themes.forEach(function (th) {
      var count = data.questions.filter(function (q) { return q.theme === th.name; }).length;
      var pill = document.createElement('div');
      pill.className = 'theme-pill clickable' + (openTheme === th.name ? ' open' : '');
      pill.innerHTML = '<span class="tp-name"></span><select class="tp-lvl"></select><em></em>';
      pill.querySelector('.tp-name').textContent = th.name;
      var lvlSel = pill.querySelector('.tp-lvl');
      var lvl = th.level > 0 ? th.level : 5;
      for (var L = 5; L <= 11; L++) {
        var op = document.createElement('option');
        op.value = L;
        op.textContent = L + ' класс';
        if (lvl === L) op.selected = true;
        lvlSel.appendChild(op);
      }
      pill.querySelector('em').textContent = count + ' вопр.';
      pill.addEventListener('click', function () {
        openTheme = openTheme === th.name ? null : th.name;
        renderAll();
      });
      ['click', 'mousedown', 'keydown'].forEach(function (ev) {
        lvlSel.addEventListener(ev, function (e) { e.stopPropagation(); });
      });
      lvlSel.addEventListener('change', function () {
        th.level = +lvlSel.value;
        save();
        renderAll();
      });
      strip.appendChild(pill);
      var opt = document.createElement('option');
      opt.value = th.name;
      dl.appendChild(opt);
    });
  }

  /* ---------------- questions ---------------- */
  function typeLabel(t) {
    return t === 'choice' ? 'варианты' : t === 'number' ? 'число' : 'текст';
  }

  function renderQuestions() {
    var list = $('#q-list');
    list.innerHTML = '';
    if (openTheme) {
      var qs = data.questions.filter(function (q) { return q.theme === openTheme; });
      $('#q-count').textContent = '— ' + qs.length + ' шт.';
      if (!qs.length) {
        list.innerHTML = '<div class="empty-state">В теме «' + openTheme + '» пока нет вопросов.<br>Нажмите «+ Добавить вопрос».</div>';
        return;
      }
      qs.forEach(function (q) {
        var row = document.createElement('div');
        row.className = 'q-row';
        row.style.borderLeftColor = colorFor(q.theme);
        row.innerHTML =
          '<span class="q-type"></span>' +
          '<span class="q-brief"><b class="b"></b><span class="t"></span></span>' +
          '<span class="q-price" style="background:var(--card);padding:4px 10px;border-radius:8px;font-weight:700;color:var(--accent);font-size:13px"></span>' +
          '<span class="row-btns"><button class="edit" type="button">Изм.</button><button class="danger" type="button">Удал.</button></span>';
        row.querySelector('.q-type').textContent = typeLabel(q.type);
        row.querySelector('.b').textContent = q.text;
        row.querySelector('.t').textContent = q.theme;
        row.querySelector('.q-price').textContent = q.price;
        row.querySelector('.edit').addEventListener('click', function () { openForm(q.id); });
        row.querySelector('.danger').addEventListener('click', function () {
          if (!confirm('Удалить вопрос?')) return;
          data.questions = data.questions.filter(function (x) { return x.id !== q.id; });
          save();
          renderAll();
        });
        list.appendChild(row);
      });
    } else {
      $('#q-count').textContent = '— откройте тему';
      list.innerHTML = '<div class="empty-state">Откройте тему, чтобы увидеть её вопросы.<br>Темы без вопросов тоже отображаются.</div>';
    }
  }

  var colorCache = {};
  function colorFor(theme) {
    if (colorCache[theme]) return colorCache[theme];
    var palette = ['#ffd23f', '#38bdf8', '#4ade80', '#c084fc', '#fb7185', '#22d3ee', '#a3e635', '#fb923c'];
    var keys = Object.keys(colorCache);
    var c = palette[keys.length % palette.length];
    colorCache[theme] = c;
    return c;
  }

  /* ---------------- form ---------------- */
  function openForm(id) {
    editingId = id || null;
    var q = id ? data.questions.find(function (x) { return x.id === id; }) : null;
    var themeName = q ? q.theme : (openTheme || (data.themes[0] ? data.themes[0].name : ''));
    $('#f-theme').value = themeName;
    var thObj = data.themes.find(function (t) { return t.name.toLowerCase() === themeName.toLowerCase(); });
    $('#f-level').value = thObj ? thObj.level : 5;
    $('#f-price').value = q ? q.price : 100;
    $('#f-type').value = q ? q.type : 'choice';
    $('#f-text').value = q ? q.text : '';
    $('#f-answer').value = q ? q.answer : '';
    var opts = q && q.options ? q.options.slice() : ['', '', '', ''];
    $$('#opt-box input').forEach(function (inp, i) { inp.value = opts[i] || ''; });
    toggleOpts();
    $('#modal-form').classList.add('open');
    $('#f-text').focus();
  }

  function closeForm() {
    $('#modal-form').classList.remove('open');
    editingId = null;
  }

  function toggleOpts() {
    $('#opts-block').style.display = $('#f-type').value === 'choice' ? '' : 'none';
  }

  function saveForm() {
    var theme = $('#f-theme').value.trim();
    var price = +$('#f-price').value;
    var type = $('#f-type').value;
    var text = $('#f-text').value.trim();
    var answer = $('#f-answer').value.trim();

    if (!theme) { toast('Укажите тему.'); return; }
    if (!text) { toast('Введите текст вопроса.'); return; }
    if (!answer) { toast('Введите правильный ответ.'); return; }

    var options = [];
    if (type === 'choice') {
      options = $$('#opt-box input').map(function (i) { return i.value.trim(); }).filter(function (v) { return v !== ''; });
      if (options.length < 2) { toast('Нужно минимум 2 варианта.'); return; }
      if (!options.some(function (o) { return o.toLowerCase() === answer.toLowerCase(); })) {
        toast('Правильный ответ должен совпадать с одним из вариантов.');
        return;
      }
      answer = options.find(function (o) { return o.toLowerCase() === answer.toLowerCase(); });
    }
    if (type === 'number' && !/^-?\d+([.,]\d+)?$/.test(answer)) { toast('Ответ должен быть числом.'); return; }

    var existing = data.themes.find(function (t) { return t.name.toLowerCase() === theme.toLowerCase(); });
    var level = +$('#f-level').value || 0;
    if (!existing) { toast('Такого предмета нет — выберите из списка.'); return; }
    existing.level = level;
    theme = existing.name;

    var dupe = data.questions.find(function (q) {
      return q.theme === theme && q.price === price && q.id !== editingId;
    });
    if (dupe && !confirm('В этой теме уже есть вопрос за ' + price + ' очков. Заменить его?')) return;
    if (dupe) data.questions = data.questions.filter(function (q) { return q.id !== dupe.id; });

    var rec = { id: editingId || nextId++, theme: theme, price: price, type: type, text: text, answer: answer };
    if (type === 'choice') rec.options = options;

    if (editingId) {
      data.questions = data.questions.map(function (q) { return q.id === editingId ? rec : q; });
    } else {
      data.questions.push(rec);
    }
    save();
    closeForm();
    renderAll();
    toast('Вопрос сохранён.');
  }

  /* ---------------- export / import ---------------- */
  function exportData() {
    var payload = Object.assign({}, data, { version: Date.now() });
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'quiz-questions.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('Файл quiz-questions.json выгружен. Положите его рядом с index.html на сайте.');
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.themes) || !Array.isArray(d.questions)) throw new Error('bad');
        if (!confirm('Заменить текущие вопросы импортированными?')) return;
        data = d;
        save();
        renderAll();
        toast('Импорт завершён.');
      } catch (e) {
        alert('Файл не похож на данные викторины.');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* ---------------- init ---------------- */
  function renderAll() {
    renderThemes();
    renderQuestions();
  }

  var EDITOR_PASSWORD = '1234';

  function lockOn() {
    $('#lock-screen').classList.add('open');
  }

  function lockOff() {
    sessionStorage.setItem('quizLock', '1');
    $('#lock-screen').classList.remove('open');
  }

  function tryUnlock() {
    if ($('#lock-input').value === EDITOR_PASSWORD) {
      lockOff();
      $('#lock-input').value = '';
    } else {
      var s = $('#lock-screen');
      s.classList.remove('shake');
      void s.offsetWidth;
      s.classList.add('shake');
      $('#lock-input').value = '';
    }
  }

  function init() {
    $('#lock-submit').addEventListener('click', tryUnlock);
    $('#lock-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    $('#btn-lock').addEventListener('click', function () { sessionStorage.removeItem('quizLock'); lockOn(); });

    $('#btn-back').addEventListener('click', function () { location.href = 'index.html'; });
    $('#btn-add-q').addEventListener('click', function () {
      if (!data.themes.length) { toast('Сначала добавьте хотя бы одну тему.'); return; }
      if (!openTheme) { toast('Откройте тему, чтобы добавить в неё вопрос.'); return; }
      openForm(null);
    });
    $('#form-close').addEventListener('click', closeForm);
    $('#modal-form').querySelector('.modal-backdrop').addEventListener('click', closeForm);
    $('#form-save').addEventListener('click', saveForm);
    $('#f-type').addEventListener('change', toggleOpts);
    $('#f-theme').addEventListener('input', function () {
      var th = this.value.trim();
      var thObj = data.themes.find(function (t) { return t.name.toLowerCase() === th.toLowerCase(); });
      if (thObj) $('#f-level').value = thObj.level;
    });
    $('#btn-export').addEventListener('click', exportData);
    $('#btn-import').addEventListener('click', function () { $('#file-input').click(); });
    $('#file-input').addEventListener('change', function () {
      if (this.files[0]) importData(this.files[0]);
      this.value = '';
    });
    renderAll();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  if (sessionStorage.getItem('quizLock') === '1') $('#lock-screen').classList.remove('open');
  else $('#lock-screen').classList.add('open');
})();</script>
</body>
</html>
